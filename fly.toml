# Fly.io config for the Ernest dashboard.
# Rename `app` to something unique, then follow DEPLOY-FLY.md.
app = "ernest-dash-qh"
primary_region = "dfw"   # Dallas — closest Fly region to Austin

[build]
  dockerfile = "Dockerfile"

[env]
  ERNEST_ENV_PATH = "/data/.env"
  ERNEST_DB_PATH = "/data/ernest.db"
  GOOGLE_CREDENTIALS_DIR = "/data/google"   # mail OAuth tokens live on the volume
  ERNEST_RUN_SCHEDULER = "1"                # run triage/briefs/canvas/news in-process
  ERNEST_RUN_BOT = "1"                      # run the interactive Discord bot in-process
  ERNEST_TZ = "America/Chicago"             # brief times are local to Austin
  PORT = "8080"

# Persistent volume: your keys and library live here, not in the image.
[mounts]
  source = "ernest_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true           # always redirect to HTTPS
  auto_stop_machines = "off"   # stay up — the scheduler must keep running
  auto_start_machines = true
  min_machines_running = 1     # always-on so triage/briefs fire without the laptop

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
